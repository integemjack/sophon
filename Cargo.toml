[package]
name = "sophon-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
resolver = "2"

# 打包的程序名：sophon（生成 sophon.exe），只含核心功能（联网研究 CLI）。
[[bin]]
name = "sophon"
path = "src/bin/sophon.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
crossbeam-channel = "0.5"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
dirs = "6"
portable-pty = "0.8"
vte = "0.13"
ureq = { version = "2", default-features = false, features = ["json", "charset", "tls"] }
base64 = "0.22"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
