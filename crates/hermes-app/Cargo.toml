[package]
name = "hermes-app"
version.workspace = true
edition.workspace = true

[dependencies]
hermes-core = { path = "../hermes-core" }
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
anyhow = "1"
parking_lot = "0.12"
