[package]
name = "hermes-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
crossbeam-channel = "0.5"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
dirs = "6"
portable-pty = "0.8"
vte = "0.13"

[dev-dependencies]
tempfile = "3"
