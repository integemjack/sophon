name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64（MSVC）
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Linux aarch64（cross 交叉编译）
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          # macOS x86_64（arm64 runner 上交叉编译）
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          # macOS aarch64（原生）
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross compile)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -like 'refs/tags/*') { $version = $env:GITHUB_REF_NAME }
          else { $version = $env:GITHUB_SHA.Substring(0, 7) }
          New-Item -ItemType Directory -Force -Path staging, dist | Out-Null
          Copy-Item "target/$env:TARGET/release/sophon.exe" staging/
          if (Test-Path README.md) { Copy-Item README.md staging/ }
          Compress-Archive -Path 'staging/*' -DestinationPath "dist/sophon-$version-$env:TARGET.zip"

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          mkdir -p staging dist
          cp "target/$TARGET/release/sophon" staging/
          files=(sophon)
          if [[ -f README.md ]]; then cp README.md staging/; files+=(README.md); fi
          tar -czf "dist/sophon-$version-$TARGET.tar.gz" -C staging "${files[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # push 到 main 时：删掉旧的滚动发布（连 tag 一起），由下一步重建到最新 commit
      - name: Reset rolling continuous release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete continuous --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true

      # tag 推送 → 以 tag 名发正式 Release；main 推送 → 滚动的 continuous 预发布
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'continuous' }}
          files: dist/*
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
